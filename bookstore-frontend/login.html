<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Haven | Login & Register</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-header">
            <i class="fas fa-book-open"></i>
            <h1>Book Haven</h1>
            <p id="form-subtitle">Welcome back! Please login</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="login-tab">
                Login
            </button>

            <button class="auth-tab" id="register-tab">
                Register
            </button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="login-form">

            <div class="form-group">
                <label for="login-email">Email</label>

                <input
                    type="email"
                    id="login-email"
                    required
                    placeholder="your@email.com"
                >
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>

                <input
                    type="password"
                    id="login-password"
                    required
                    placeholder="••••••••"
                >

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember-me">

                <label for="remember-me">
                    Remember me
                </label>
            </div>

            <button type="submit" class="btn">
                Login
            </button>

            <div class="auth-footer">
                <p>
                    Don't have an account?
                    <a href="#" id="switch-to-register">
                        Register here
                    </a>
                </p>
            </div>

        </form>


        <!-- Registration Form -->
        <form class="auth-form" id="register-form">

            <div class="form-group">
                <label for="register-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="register-name"
                    required
                    placeholder="John Doe"
                >
            </div>

            <div class="form-group">
                <label for="register-email">
                    Email
                </label>

                <input
                    type="email"
                    id="register-email"
                    required
                    placeholder="your@email.com"
                >
            </div>

            <div class="form-group">
                <label for="register-password">
                    Password
                </label>

                <input
                    type="password"
                    id="register-password"
                    required
                    placeholder="••••••••"
                >

                <small class="password-hint">
                    Minimum 8 characters
                </small>
            </div>

            <div class="form-group">
                <label for="register-confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="register-confirm-password"
                    required
                    placeholder="••••••••"
                >
            </div>

            <div class="terms-agree">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to the
                    <a href="#">Terms</a>
                    and
                    <a href="#">Privacy Policy</a>
                </label>

            </div>

            <button type="submit" class="btn">
                Register
            </button>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="#" id="switch-to-login">
                        Login here
                    </a>
                </p>
            </div>

        </form>


        <div id="auth-message" class="auth-message"></div>

    </div>


    <script src="login.js"></script>

</body>
</html>
